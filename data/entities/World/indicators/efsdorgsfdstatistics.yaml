description: EFSD analytical database aggregating sovereign financing operations by
  international financial institutions for the fund's member states (Armenia, Belarus,
  Kazakhstan, Kyrgyzstan, Russia, Tajikistan), extended with Afghanistan and Pakistan
  under the CAREC Program. Data is updated quarterly; methodology is documented in
  EFSD Working Paper WP/23/1. Full database is provided upon request via sfd@efsd.org.
