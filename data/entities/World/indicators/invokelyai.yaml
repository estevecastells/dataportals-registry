description: >-
  Public catalog of official-statistics indicators with definitions, units and rankings.
  Values are available through a hosted REST API for US states and counties, EU regions,
  Spanish municipalities, and country and world indicators from the World Bank. Each value
  includes its publisher and a citation. The catalog is browsable without an account; API
  access requires a free account and key. The free plan includes 500 calls per month and the
  latest 60 points per series. Full history and CSV export require a paid plan. Original
  publishers' licenses govern reuse.
