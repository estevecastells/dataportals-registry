name: NSPD Platform
website: https://nspd.gov.ru
description: Closed-source geoportal stack behind the Russian Federal Information System
  "Unified Digital Platform NSPD" (ФГИС ЕЦП НСПД) operated by Rosreestr and built by
  BFT Holding with Rostelecom. React/Vite SPA with an OpenLayers map and a map URL
  scheme of zoom/coordinate_x/coordinate_y/theme_id/baseLayerId/active_layers; Node.js
  microservices under /api/geoportal/v1|v2/ (search, themes, baselayers, tab data)
  and /api/layers/v3/layers/{id} layer configs with systemInfo/groupedLayers JSON;
  the internal "aeggis" tile service serves WMTS tiles and WMS (/api/aeggis/v2..v4/
  {id}/wmts/{z}/{x}/{y}.png, /api/aeggis/v{3,4}/{id}/wms) from Kubernetes pods
  (x-app-name tileserver, x-node tileserver-*). Flagship deployment nspd.gov.ru
  replaced the public cadastral map pkk.rosreestr.ru in 2025; the CIS geoportal
  cisgeo.info runs the same stack.
